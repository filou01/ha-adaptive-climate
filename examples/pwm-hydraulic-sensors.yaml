# English: Optional YAML example, not installed automatically. Replace climate.zone_a.
# Deutsch: Optionales YAML-Beispiel, keine automatische Installation. climate.zone_a ersetzen.
# UI Template helpers can use the same state/availability expressions.
# UI-Template-Helper können dieselben Zustands-/Verfügbarkeitsausdrücke verwenden.
template:
  - sensor:
      - name: Zone A Hydraulic Consistency
        unique_id: zone_a_hydraulic_consistency
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') %}{{ p is mapping and p.get('hydraulic_consistency', {}).get('score') is number }}
        state: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('score') }}
        attributes:
          collection_id: >-
            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('collection_id') }}
      - name: Zone A Solo Heating
        unique_id: zone_a_solo_heating
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') %}{{ p is mapping and p.get('hydraulic_consistency', {}).get('solo_runtime_pct') is number }}
        state: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('solo_runtime_pct') }}
        attributes:
          collection_id: >-
            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('collection_id') }}
      - name: Zone A Mean Competing Load
        unique_id: zone_a_mean_competing_load
