            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('collection_id') }}
      - name: Zone A Heating Control Output
        unique_id: zone_a_heating_control_output
        unit_of_measurement: "%"
        state_class: measurement
        availability: >-
          {{ state_attr('climate.zone_a', 'control_output') is number }}
        state: >-
          {{ state_attr('climate.zone_a', 'control_output') }}
