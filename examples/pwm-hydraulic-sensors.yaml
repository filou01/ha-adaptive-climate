        availability: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') %}{{ p is mapping and p.get('hydraulic_consistency', {}).get('competing_load_changes') is number }}
        state: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('competing_load_changes') }}
        attributes:
          collection_id: >-
            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('collection_id') }}
      - name: Zone A Hydraulic Active Time
        unique_id: zone_a_hydraulic_active_time
        state_class: total_increasing
        unit_of_measurement: "s"
        availability: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') %}{{ p is mapping and p.get('hydraulic_consistency', {}).get('cumulative_active_seconds') is number }}
        state: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('cumulative_active_seconds') }}
        attributes:
          collection_id: >-
            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('collection_id') }}
