# English: Optional YAML example, not installed automatically. Replace climate.zone_a.
# Deutsch: Optionales YAML-Beispiel, keine automatische Installation. climate.zone_a ersetzen.
# UI Template helpers can use the same state/availability expressions.
# UI-Template-Helper können dieselben Zustands-/Verfügbarkeitsausdrücke verwenden.
template:
  - sensor:
      - name: Zone A Hydraulic Consistency
        unique_id: zone_a_hydraulic_consistency
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') %}{% set h = p.get('hydraulic_consistency') if p is mapping else none %}{{ h is mapping and h.get('score') is number }}
        state: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{% set h = p.get('hydraulic_consistency') if p is mapping else none %}{{ h.get('score') if h is mapping else none }}
        attributes:
          collection_id: >-
            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{% set h = p.get('hydraulic_consistency') if p is mapping else none %}{{ h.get('collection_id') if h is mapping else none }}
      - name: Zone A Solo Heating
        unique_id: zone_a_solo_heating
        state_class: measurement
        unit_of_measurement: "%"
        availability: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') %}{% set h = p.get('hydraulic_consistency') if p is mapping else none %}{{ h is mapping and h.get('solo_runtime_pct') is number }}
        state: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{% set h = p.get('hydraulic_consistency') if p is mapping else none %}{{ h.get('solo_runtime_pct') if h is mapping else none }}
        attributes:
          collection_id: >-
            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{% set h = p.get('hydraulic_consistency') if p is mapping else none %}{{ h.get('collection_id') if h is mapping else none }}
      - name: Zone A Mean Competing Load
