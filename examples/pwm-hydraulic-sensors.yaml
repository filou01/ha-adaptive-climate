        availability: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') %}{{ p is mapping and p.get('hydraulic_consistency', {}).get('mean_competing_load') is number }}
        state: >-
          {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('mean_competing_load') }}
        attributes:
          collection_id: >-
            {% set p = state_attr('climate.zone_a', 'pwm_coordination') or {} %}{{ p.get('hydraulic_consistency', {}).get('collection_id') }}
      - name: Zone A Hydraulic Load Changes
        unique_id: zone_a_hydraulic_load_changes
