name: PWM and hydraulic validation

on:
  workflow_dispatch:
  push:
    branches: ["feat/**", "ci/**"]
  pull_request:
    branches: [main]
    paths:
      - "custom_components/adaptive_climate/**"
      - "tests/**"
      - "tools/**"
      - ".github/workflows/pwm-validation.yml"

permissions:
  contents: read

concurrency:
  group: pwm-hydraulic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt ruff pyright
      - run: python -m pytest tests/ -q --tb=short
      - run: ruff check custom_components/ tests/ tools/
      - run: ruff format --check custom_components/ tests/ tools/
      - run: pyright custom_components/adaptive_climate/
  real-ha-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install homeassistant==2026.11.0
      - run: python tools/verify_pwm_store.py
