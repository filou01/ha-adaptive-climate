name: Isolated PR validation

on:
  push:
    branches: [ci/pr-learning-validation, ci/pr-pump-validation, ci/pr-compatibility]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-test.txt ruff pyright
      - run: python -m pytest tests/ -q --tb=short
      - run: ruff check custom_components/ tests/
      - run: ruff format --check custom_components/ tests/
      - run: pyright custom_components/adaptive_climate/
